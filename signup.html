<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Create Account | ProjectCreation</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
  <link href="/assets/site.css?v=202605212255" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background min-h-screen overflow-x-hidden">
<script src="/assets/theme-restore.js"></script>
  <script src="/assets/font-guard.js"></script>

  <header class="bg-background border-b border-outline-variant sticky top-0 z-50">
    <nav class="flex justify-between items-center w-full px-margin-desktop py-base">
      <a href="/" class="font-headline-sm text-headline-sm font-bold text-on-background tracking-tighter no-underline hover:text-primary-fixed-dim transition-colors">
        ProjectCreation
      </a>
      <a href="/#community" class="hidden md:block font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200">Community</a>
      <a href="/login.html" class="font-label-md text-label-md text-primary-fixed-dim hover:text-primary transition-colors">
        Sign in →
      </a>
    </nav>
  </header>

  <main class="flex items-center justify-center min-h-[calc(100vh-57px)] px-margin-mobile py-xl">
    <div class="w-full max-w-md">

      <div class="border border-outline-variant bg-surface-container p-md md:p-xl">

        <div class="mb-lg">
          <div class="flex items-center gap-xs mb-sm">
            <div class="w-2 h-2 bg-primary-fixed-dim animate-pulse"></div>
            <span class="font-label-sm text-label-sm text-primary-fixed-dim uppercase tracking-widest">Auth_Init.exe</span>
          </div>
          <h1 class="font-headline-md text-headline-md text-on-background">Create Account</h1>
          <p class="font-body-md text-body-md text-on-surface-variant mt-xs">
            Enter your credentials. A 6-digit verification code will be sent to your email.
          </p>
        </div>

        <form id="signupForm" class="flex flex-col gap-sm" novalidate autocomplete="off">

          <div class="flex flex-col gap-1">
            <label for="email" class="font-label-sm text-label-sm text-primary-fixed-dim uppercase tracking-widest">Email</label>
            <input
              id="email" type="email" required autocomplete="email" maxlength="254"
              class="bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md px-sm py-xs focus:outline-none focus:border-primary-fixed-dim transition-colors w-full"
              placeholder="you@example.com"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="password" class="font-label-sm text-label-sm text-primary-fixed-dim uppercase tracking-widest">Password</label>
            <input
              id="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"
              class="bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md px-sm py-xs focus:outline-none focus:border-primary-fixed-dim transition-colors w-full"
              placeholder="Minimum 8 characters"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="confirmPassword" class="font-label-sm text-label-sm text-primary-fixed-dim uppercase tracking-widest">Confirm Password</label>
            <input
              id="confirmPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password"
              class="bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md px-sm py-xs focus:outline-none focus:border-primary-fixed-dim transition-colors w-full"
              placeholder="Repeat password"
            />
          </div>

          <div id="errorMsg" class="hidden font-label-sm text-label-sm text-error border border-error-container bg-error-container/10 px-sm py-xs mt-xs" role="alert" aria-live="polite"></div>

          <button
            id="submitBtn" type="submit"
            class="mt-sm w-full bg-primary-container text-on-primary border border-primary-container font-label-md text-label-md px-md py-sm hover:bg-transparent hover:text-primary-container transition-all disabled:opacity-50 disabled:cursor-not-allowed"
          >
            INITIALIZE ACCOUNT
          </button>

        </form>

        <p class="mt-md font-label-sm text-label-sm text-on-surface-variant text-center">
          Already have an account?
          <a href="/login.html" class="text-primary-fixed-dim hover:text-primary transition-colors ml-1">Sign in</a>
        </p>

      </div>

      <p class="mt-sm font-label-sm text-label-sm text-outline text-center">
        © 2026 ProjectCreation. Engineered for Digital Craft.
      </p>
    </div>
  </main>
  <script src="/assets/supabase.min.js"></script>
  <script src="/assets/signup.js"></script>
</body>
</html>
